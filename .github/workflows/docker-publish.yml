# 发布预构建多架构镜像到 GHCR（issue #116）
#
# 为什么要有这个 workflow：README 的「一键部署」原先要求在**目标主机**上编译 Next.js，
# 而这是全流程唯一的内存密集步骤（`next build` 峰值 1.5–2.5 GiB）。在 2 vCPU / 3.83 GiB
# 的机器上，构建会转入 swap 抖动、把宿主机拖死约 10 分钟且没有 OOM-kill 记录（issue #115）。
# 把编译搬到 runner 上，目标机就只剩「拉取镜像」。
#
# 结构参考先例 new-api 的 docker-build.yml（多架构矩阵 + 原生 ARM runner + imagetools 合并）：
#   - arm64 用 ubuntu-24.04-arm **原生**构建。不要换成 QEMU —— Next.js 构建在模拟下要 20–40 分钟。
#   - GHA cache 按 arch 分 scope，避免跨架构缓存污染。
#   - action 用 tag 引用（与 ci.yml 一致）；要收紧供应链可另行改钉 commit SHA。
#
# ⚠️ 镜像路径必须与 docker-compose.yml 里的 `image:` 完全一致（含大小写，GHCR 只接受小写）。
name: Publish Docker image (multi-arch)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（如 v0.6.0；必须是已存在的 tag）'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/evanfang0054/motif

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动补发时必须按输入的 tag 检出，否则会拿默认分支的代码去构建那个 tag 的镜像
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析并校验发布的 tag
        id: tag
        env:
          # 经 env 传，避免把 dispatch 输入直接插值进 shell
          IN_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$IN_TAG" ]; then
            TAG="$IN_TAG"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::tag '$TAG' 不存在"
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次发布：$TAG / ${{ matrix.arch }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: 记录本次产物到 job 摘要
        run: |
          echo "### ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:${{ steps.tag.outputs.value }}-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: 合并多架构 manifest
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 用两个 arch 的镜像合成 manifest
        # tag 的合法性已在上游 build job 校验过，这里直接用表达式取
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAGS=(-t "$IMAGE:$TAG")
          # ⚠️ 预发布 tag（含 `-`，如 v0.6.1-rc.1）**不要顶掉 latest**：
          #    否则「一键部署」的默认路径（拉 :latest）会拿到 RC 内容。
          case "$TAG" in
            *-*) echo "「$TAG」是预发布 tag，本次不更新 latest" ;;
            *) TAGS+=(-t "$IMAGE:latest") ;;
          esac
          docker buildx imagetools create "${TAGS[@]}" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"

      - name: 回读 manifest 作证据
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: docker buildx imagetools inspect "$IMAGE:$TAG"
